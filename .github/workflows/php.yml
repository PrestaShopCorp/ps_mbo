name: PHP tests
on: [pull_request]
jobs:
  dependency-php85-smoke:
    name: Bundled dependency smoke on PHP 8.5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 8.5
          extensions: bcmath
      - run: composer install --no-dev --prefer-dist --no-interaction --no-progress
      - name: Load dependencies and exercise promise outcomes without deprecations
        run: |
          php -d error_reporting=-1 <<'PHP'
          <?php
          set_error_handler(static function ($level, $message) {
              if ($level === E_DEPRECATED) {
                  throw new RuntimeException($message);
              }
              return false;
          });
          require 'vendor/autoload.php';
          $promise = new GuzzleHttp\Promise\Promise();
          $result = $promise->then(static fn ($value) => $value * 2);
          $promise->resolve(7);
          if ($result->wait() !== 14) {
              throw new RuntimeException('Promise fulfillment changed');
          }
          $rejection = GuzzleHttp\Promise\Create::rejectionFor('synthetic');
          if ($rejection->otherwise(static fn ($reason) => $reason)->wait() !== 'synthetic') {
              throw new RuntimeException('Promise rejection changed');
          }
          echo "Dependency autoload and promise smoke passed\n";
          PHP
  php-linter:
    name: PHP Syntax check 8.1 => 8.5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: PHP syntax checker 8.1
        uses: prestashop/github-action-php-lint/8.1@master
      - name: PHP syntax checker 8.2
        uses: prestashop/github-action-php-lint/8.2@master
      - name: PHP syntax checker 8.3
        uses: prestashop/github-action-php-lint/8.3@master
      - name: PHP syntax checker 8.4
        uses: prestashop/github-action-php-lint/8.4@master
      - name: PHP syntax checker 8.5
        uses: prestashop/github-action-php-lint/8.5@master
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: 8.1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate composer config
        run: composer validate --strict

      - name: Composer Install
        run: COMPOSER_PROCESS_TIMEOUT=600 composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Run PHPCSFixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

  # Run PHPStan against the module and a PrestaShop release
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        presta-version: [ '9.0.x' ]
        php-version: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout
        uses: actions/checkout@v6

      # Add vendor folder in cache to make next builds faster
      - name: Cache vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: php-${{ hashFiles('composer.lock') }}

      # Add composer local folder in cache to make next builds faster
      - name: Cache composer folder
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: php-composer-cache

      - run: composer install

      # Docker images prestashop/prestashop may be used, even if the shop remains uninstalled
      - name: Execute PHPStan on PrestaShop (Tag ${{ matrix.presta-version }}-${{ matrix.php-version }}))
        run: ./tests/phpstan.sh ${{ matrix.presta-version }} ${{ matrix.php-version }}

  phpunit:
    name: PHPUnit ${{ matrix.presta-versions }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        presta-versions: ['9.0.x']
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: 8.1

      - name: Checkout
        uses: actions/checkout@v6

      # Add vendor folder in cache to make next builds faster
      - name: Cache vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: php-${{ hashFiles('composer.lock') }}

      # Add composer local folder in cache to make next builds faster
      - name: Cache composer folder
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: php-composer-cache

      - run: composer install
      - run: |
          ./tests/phpunit.sh ${{ matrix.presta-versions }}
